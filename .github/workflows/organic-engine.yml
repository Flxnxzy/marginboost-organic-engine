name: MarginBoost Organic Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: marginboost-organic-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run organic acquisition engine
        env:
          AUTO_PUBLISH: "true"
          ENABLE_PUBLIC_REPLIES: "true"
          ENABLE_LIKES: "true"
          ENABLE_FOLLOWS: "true"

          # One false-positive reply from V3.2 was to a construction/engineering
          # company. Delete it once, then state prevents repeat attempts.
          DELETE_REPLY_URIS: "at://did:plc:fem7iqbne4adhmix4d7vjwwk/app.bsky.feed.post/3mvnoy74k3i27"

          # V3 prioritises direct, relevant public conversations over
          # standalone posts to an empty follower graph.
          MAX_POSTS_PER_RUN: "1"
          MAX_POSTS_PER_DAY: "1"

          # Conservative anti-spam caps for public replies.
          MAX_REPLIES_PER_RUN: "1"
          MAX_REPLIES_PER_DAY: "5"
          MIN_REPLY_SCORE: "18"

          MAX_LIKES_PER_RUN: "5"
          MAX_LIKES_PER_DAY: "25"
          MIN_LIKE_SCORE: "12"

          MAX_FOLLOWS_PER_RUN: "1"
          MAX_FOLLOWS_PER_DAY: "3"
          MIN_FOLLOW_SCORE: "14"

          AUTHOR_COOLDOWN_DAYS: "7"

          MIN_SCORE: "8"
          MARGINBOOST_URL: "https://marginboost.co.za"

          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

          MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}

          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_REFRESH_TOKEN: ${{ secrets.REDDIT_REFRESH_TOKEN }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

          REDDIT_AUTO_COMMENT: "false"
          REDDIT_COMMENT_ALLOWLIST: ""
          MAX_REDDIT_COMMENTS_PER_RUN: "1"
          MAX_REDDIT_COMMENTS_PER_DAY: "3"
          MIN_REDDIT_REPLY_SCORE: "18"
        run: python -m src.main

      - name: Persist acquisition state
        run: |
          if git diff --quiet -- data/state.json data/latest.json data/latest_engagement.json data/latest_reddit.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "marginboost-organic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/latest.json data/latest_engagement.json data/latest_reddit.json
          git commit -m "chore: persist organic acquisition state"
          git push